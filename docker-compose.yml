services:
  web:
    build:
      context: .
      target: production
      args:
        NEXT_PUBLIC_GITHUB_URL: ${NEXT_PUBLIC_GITHUB_URL}
        NEXT_PUBLIC_LINKEDIN_URL: ${NEXT_PUBLIC_LINKEDIN_URL}
        NEXT_PUBLIC_X_URL: ${NEXT_PUBLIC_X_URL}
        NEXT_PUBLIC_MEDIUM_URL: ${NEXT_PUBLIC_MEDIUM_URL}
        NEXT_PUBLIC_CALENDLY_URL: ${NEXT_PUBLIC_CALENDLY_URL}
        NEXT_PUBLIC_TWITTER_HANDLE: ${NEXT_PUBLIC_TWITTER_HANDLE}
        NEXT_PUBLIC_CONTACT_FORM_URL: ${NEXT_PUBLIC_CONTACT_FORM_URL}
        NEXT_PUBLIC_SUMERU_DEMO_URL: ${NEXT_PUBLIC_SUMERU_DEMO_URL}
        NEXT_PUBLIC_SUMERU_GITHUB_URL: ${NEXT_PUBLIC_SUMERU_GITHUB_URL}
        NEXT_PUBLIC_SENTINEL_COVER_URL: ${NEXT_PUBLIC_SENTINEL_COVER_URL}
        NEXT_PUBLIC_SENTINEL_DEMO_URL: ${NEXT_PUBLIC_SENTINEL_DEMO_URL}
        NEXT_PUBLIC_SENTINEL_GITHUB_URL: ${NEXT_PUBLIC_SENTINEL_GITHUB_URL}
        NEXT_PUBLIC_LLM_COVER_URL: ${NEXT_PUBLIC_LLM_COVER_URL}
        NEXT_PUBLIC_ANALYTICS_COVER_URL: ${NEXT_PUBLIC_ANALYTICS_COVER_URL}
        NEXT_PUBLIC_LIVECLASS_COVER_URL: ${NEXT_PUBLIC_LIVECLASS_COVER_URL}
        NEXT_PUBLIC_LIVECLASS_DEMO_URL: ${NEXT_PUBLIC_LIVECLASS_DEMO_URL}
        NEXT_PUBLIC_LIVECLASS_GITHUB_URL: ${NEXT_PUBLIC_LIVECLASS_GITHUB_URL}
        NEXT_PUBLIC_SWIFTSCHOOL_DEMO_URL: ${NEXT_PUBLIC_SWIFTSCHOOL_DEMO_URL}
        NEXT_PUBLIC_SWIFTSCHOOL_GITHUB_URL: ${NEXT_PUBLIC_SWIFTSCHOOL_GITHUB_URL}
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      NEXT_TELEMETRY_DISABLED: "1"

  dev:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    profiles:
      - dev
